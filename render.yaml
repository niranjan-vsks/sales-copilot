services:
  # ── FastAPI backend ──────────────────────────────────────────────────────────
  - type: web
    name: sales-copilot-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: sales_copilot
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_REDIRECT_URI
        value: https://sales-copilot-api.onrender.com/api/auth/microsoft/callback
      - key: D365_ORG_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: INTERNAL_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://sales-copilot-ui.onrender.com
      - key: CORS_ORIGINS
        value: https://sales-copilot-ui.onrender.com

  # ── React frontend ───────────────────────────────────────────────────────────
  - type: web
    name: sales-copilot-ui
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: yarn install && yarn build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://sales-copilot-api.onrender.com
